[project]
name = "cost-tracking-backend"
version = "0.1.0"
description = "Cost Tracking API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "cos-python-sdk-v5>=1.9", "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
