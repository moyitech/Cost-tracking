name: cost-tracking

services:
  postgres:
    # Existing local image: PostgreSQL 17.5.
    image: postgres:17
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cost_tracking}
      POSTGRES_USER: ${POSTGRES_USER:-cost_tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cost_tracking_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25473}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    # Existing local image: Redis 7.0.15.
    image: redis:7.0-alpine
    pull_policy: missing
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-26381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
