<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭邀请 · 五版设计</title><style>

:#fff;padding:15px 17px;border-radius:12px;box-shadow:0 8px 26px #102d3330;font-size:12px;line-height:1.8;font-weight:400;text-align:left}.popover:before{content:"";position:absolute;top:-5px;left:63px;background:#24483c;width:10px;height:10px;transform:rotate(45deg)}[hidden]{display:none!important}.form{margin-top:30px}label{display:block;font-size:14px;font-weight:650;margin-bottom:11px}.required{font-size:11px;color:#7b897f;font-weight:400;margin-left:7px}.inputwrap{border:1.5px solid #adc3b5;border-radius:12px;background:#fff;transition:.2s;display:flex;align-items:center}.inputwrap:focus-within{border-color:#226349;box-shadow:0 0 0 3px #22634914}.inputwrap input{border:0;outline:0;background:transparent;width:100%;min-width:0;padding:17px 15px;font-size:15px;color:#203e35}.inputwrap input::placeholder{color:#95a198}.error{font-size:12px;min-height:27px;padding-top:7px;color:#bf4f40}form.invalid .inputwrap{border-color:#cb5d4a;background:#fff5f1;box-shadow:0 0 0 3px #cb5d4a10;animation:shake .25s}.primary{border:0;width:100%;background:#205b44;color:#fff;border-radius:13px;height:51px;font-size:15px;font-weight:600;box-shadow:0 5px 12px #205b4414}.primary:active{transform:translateY(1px)}.expiry{font-size:10px;color:#8c978f;line-height:1.8;text-align:center;margin:17px -5px 0}.signature{font-size:11px;color:#8b9b90;text-align:center;margin:26px 0 0;letter-spacing:1px}.notice{color:#226349;font-size:12px;line-height:1.6;margin:12px 0 0}.description{font-size:12px;color:#687b70;line-height:1.7;margin:12px 4px}.v1 .content{padding-top:25px}.v1 .role{border-top:1px solid #dfe7df;padding-top:20px}.v1 .popover{top:49px}.v1 .form{margin-top:34px}.v2 .phone{background:#f7f6ef}.v2 .hero{background:#214b3d;color:#fff;margin:-10px -22px 0;padding:28px 24px 27px;border-radius:0 0 28px 28px;overflow:visible}.v2 .brand{color:#b1c7b8}.v2 .emblem{background:#ffffff13;border:1px solid #ffffff2a;color:#e3e9c7}.v2 .inviter{color:#c4d3c8}.v2 .role p{color:#c4d3c8}.v2 .info{color:#d0dfd1;border-color:#8ca995}.v2 .role{margin-top:23px}.v2 .form{margin-top:26px}.v2 .primary{background:#244c3e}.v2 .signature{margin-top:20px}.v3 .phone{background:#f8f3e9}.v3 .content{padding-top:19px}.v3 .hero{text-align:center}.v3 .emblem{margin:20px auto 17px;background:#eee3c9;border-radius:50%;width:78px;height:78px;color:#6b7951}.v3 .family{font-family:serif;font-size:27px}.v3 .role{background:#f0eadc;border-radius:16px;padding:16px;text-align:left}.v3 .popover{top:44px}.v3 .form{background:#fffdf7;padding:21px 18px 18px;border:1px solid #e8e1d1;border-radius:20px;margin:24px -3px 0}.v3 .inputwrap{border-color:#c3c5ad;background:#fdfcf8}.v3 .primary{background:#586c48}.v3 .expiry{margin-top:14px;font-size:9px}.v3 .signature{margin-top:23px}.v4 .phone{background:#fff}.v4 .content{padding-top:25px}.v4 .brand{color:#255e46}.v4 .emblem{width:46px;height:46px;font-size:25px;border-radius:12px;margin-top:27px}.v4 .family{font-size:27px}.v4 .role{border-bottom:1px solid #e5eae5;padding-bottom:22px}.v4 .form{margin-top:24px}.v4 label:before{content:'01';font-size:10px;background:#e8f1e9;color:#32674c;padding:4px 5px;border-radius:4px;margin-right:8px}.v4 .inputwrap{border-radius:8px;border-width:2px}.v4 .primary{border-radius:8px;text-align:left;padding:0 17px}.v4 .primary:after{content:'→';float:right}.v4 .signature{margin-top:40px}.v5 .phone{background:#e8f0e8}.v5 .content{padding:14px 16px}.v5 .hero{background:#fffdf8;border-radius:25px 25px 0 0;padding:25px 22px 0;text-align:center}.v5 .emblem{margin:24px auto 18px;border-radius:22px 22px 10px 22px;background:#dce9b9;color:#46613d;transform:rotate(-5deg)}.v5 .family{font-size:24px}.v5 .role{background:#f1f5e8;border-radius:13px;padding:15px 12px;text-align:left}.v5 .popover{top:43px}.v5 .form{background:#fffdf8;margin:0;padding:25px 22px 23px;border-radius:0 0 25px 25px}.v5 .inputwrap{border:2px solid #a5ba91;border-radius:14px;background:#fbfdf7}.v5 .primary{background:#315e42;border-radius:30px}.v5 .expiry{font-size:9px}.v5 .signature{margin-top:24px}.shape{position:absolute;right:4px;top:40px;color:#c7d5c5;font-size:62px;font-family:serif;pointer-events:none}.v2 .shape{right:28px;top:48px;color:#ffffff20;font-size:90px}.v3 .shape,.v5 .shape{display:none}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@media(max-width:600px){header{padding:24px 20px}.gallery{padding:0 16px 30px;gap:16px;scroll-snap-type:x mandatory;overflow-x:auto}.candidate{width:min(360px,calc(100vw - 32px));scroll-snap-align:center}.phone{min-height:750px}}body.single header,body.single .caption,body.single .description{display:none}body.single .gallery{padding:0;display:block}body.single .candidate{display:none;width:100%}body.single .candidate.selected{display:block}body.single .phone{border:0;border-radius:0;min-height:100vh;box-shadow:none}
</style><header><h1>家庭邀请 · 五种设计方向</h1><p>点击 ! 查看隐私浮层；直接点击「确认加入家庭」体验昵称校验。填写昵称后仅演示反馈，不会实际加入家庭。<br>向右滚动比较五版；手机可横向滑动。所有版本均为可交互设计稿。</p></header><main class="gallery"></main><script>
const names=['极简留白','深绿邀请函','温暖家居','轻量清单','圆润卡片'];const desc=['去掉厚重外框，以留白和分隔线建立层次。清爽、安静，突出家庭与昵称。','深绿上半区承载邀请信息，下半区专注填写。主次分明，品牌辨识度更强。','奶油色与柔和衬线标题，独立填写卡片。更温暖，像家人送来的一封邀请。','紧凑左对齐，清楚的步骤标识与硬朗输入框。直观高效，减少装饰。','浅绿底搭配圆润奶白卡片，点缀嫩绿色。轻松亲切，更有生活感。'];
document.querySelector('.gallery').innerHTML=names.map((name,i)=>`<section class="candidate v${i+1}" id="v${i+1}"><h2 class="caption"><span class="number">0${i+1}</span>${name}</h2><div class="phone"><div class="status"><span>9:41</span><span>▮▮▮　 Wi-Fi　▰</span></div><div class="nav"><span class="back">‹</span>家庭邀请<span class="capsule">••• ◉</span></div><div class="content"><div class="hero"><div class="brand">用本 · 家庭共享</div><span class="shape">⌂</span><div class="emblem">家</div><h2 class="family">王泽宇的宿舍</h2><p class="inviter">王泽宇 邀请你加入</p><div class="role"><div class="roleline">以编辑者加入 <button class="info" aria-label="查看个人物品隐私说明" aria-expanded="false">!</button></div><p>一起添加、整理和编辑家庭物品</p><div class="popover" role="status" hidden>共享家里的物品，保留自己的空间。<br>你的个人物品仍仅自己可见，不会自动迁入家庭。</div></div></div><form class="form" novalidate><label for="nickname${i}">我的家庭昵称<span class="required">必填</span></label><div class="inputwrap"><input id="nickname${i}" placeholder="填写昵称，让家人认出你" maxlength="30" autocomplete="off" aria-describedby="error${i}"></div><div id="error${i}" class="error" aria-live="polite"></div><button class="primary" type="submit">确认加入家庭</button><p class="notice" hidden></p><p class="expiry">2026年10月31日 13:29 过期（剩余6天23小时）</p></form><p class="signature">一起记录，让每件物品都有迹可循。</p></div></div><p class="description">${desc[i]}</p></section>`).join('');
document.querySelectorAll('.candidate').forEach(card=>{const info=card.querySelector('.info'), pop=card.querySelector('.popover'),form=card.querySelector('form'),input=card.querySelector('input'),error=card.querySelector('.error'),notice=card.querySelector('.notice');info.onclick=e=>{e.stopPropagation();const show=pop.hidden;document.querySelectorAll('.popover').forEach(p=>p.hidden=true);document.querySelectorAll('.info').forEach(b=>b.setAttribute('aria-expanded','false'));pop.hidden=!show;info.setAttribute('aria-expanded',String(show))};form.onsubmit=e=>{e.preventDefault();notice.hidden=true;if(!input.value.trim()){form.classList.add('invalid');error.textContent='请填写家庭昵称，让家人知道你是谁';input.setAttribute('aria-invalid','true');input.focus()}else{notice.hidden=false;notice.textContent=`已填写「${input.value.trim()}」。正式版本将在确认后加入家庭。`}};input.oninput=()=>{form.classList.remove('invalid');error.textContent='';input.removeAttribute('aria-invalid');notice.hidden=true}});document.addEventListener('click',e=>{if(!e.target.closest('.role')){document.querySelectorAll('.popover').forEach(p=>p.hidden=true);document.querySelectorAll('.info').forEach(b=>b.setAttribute('aria-expanded','false'))}});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.click()});const v=new URLSearchParams(location.search).get('v');if(v&&document.getElementById('v'+v)){document.body.classList.add('single');document.getElementById('v'+v).classList.add('selected')}
</script></html>
