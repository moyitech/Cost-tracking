nt-size:10px;color:#7d8e75;letter-spacing:1px;margin:0 0 8px}.group{background:white;border-radius:13px;padding:0 13px;margin-bottom:20px;border:1px solid #e5eadf}.group .person{border:0;padding:14px 0}.v3 .avatar{width:36px;height:36px;border-radius:50%;font-size:15px}.v3 .edit-entry{margin:0;padding:2px 1px 8px;background:none}.v3 .footnote{text-align:left;margin:14px 0 0}.v4 .sheet{min-height:485px;background:#f9f9f2}.v4 .sheethead{padding-bottom:22px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#fff;border:1px solid #e1e7d9;border-radius:19px;padding:20px 12px 0;text-align:center;min-width:0}.tile.owner{background:#edf3df;border-color:#d4dfc1}.tile .avatar{width:52px;height:52px;margin:0 auto 13px;border-radius:18px}.tile .name{font-size:14px;margin-bottom:8px}.tile .sub{margin:0}.tile .tile-action{display:block;width:calc(100% + 24px);margin:18px -12px 0;border-top:1px solid #e3e8da;padding:13px 0;font-size:11px;color:#537445}.v4 .footnote{background:#f0f2e8;text-align:left;border-radius:10px;padding:13px 14px;margin-top:19px}.v5 .sheet{min-height:520px;background:#fffefa}.v5 .sheethead{padding-bottom:23px}.profile{display:flex;align-items:flex-start;background:#e9f0e5;border-radius:18px;padding:21px 17px;gap:13px;border:1px solid #dce6d4}.profile .avatar{width:49px;height:49px;border-radius:50%;font-size:21px}.profile .name{font-size:19px;margin:3px 0 9px}.profile .action{font-size:11px;padding:0;margin-top:8px;min-height:25px}.v5 .group-label{margin-top:27px;margin-bottom:0}.v5 .person{border:0;padding-top:16px}.v5 .footnote{margin-top:20px;padding-top:17px;border-top:1px solid #e6eadd}.panel-cover{position:absolute;inset:0;background:#1a2c2869;z-index:5;display:flex;align-items:flex-end}.panel{background:#fcfdf9;border-radius:23px 23px 0 0;width:100%;padding:24px 22px 35px;box-shadow:0 -5px 25px #25433315}.panel h3{margin:0;font-size:19px}.panel .hint{font-size:12px;color:#85917f;line-height:1.7;margin:9px 0 19px}.panel label{display:block;font-size:12px;color:#5d775e;margin-bottom:10px}.panel input{width:100%;border:1.5px solid #abc09d;border-radius:11px;padding:14px;color:#294b38;background:#fff;outline:0}.panel input:focus{border-color:#37724d;box-shadow:0 0 0 3px #37724d13}.panel input.invalid{border-color:#c76852;background:#fff5f0}.error{min-height:27px;font-size:11px;color:#b75944;padding-top:6px}.primary{background:#2b5b40;color:#fff;border-radius:11px;width:100%;padding:14px;font-size:13px;font-weight:600}.cancel{display:block;margin:10px auto 0;padding:10px;font-size:12px;color:#7e8b78}.option{display:flex;align-items:center;text-align:left;width:100%;border:1px solid #e2e8dc;border-radius:12px;padding:13px;margin-bottom:9px;gap:10px}.option b{font-size:13px;display:block}.option small{font-size:10px;display:block;color:#879480;margin-top:5px}.option.selected{background:#edf3e6;border-color:#aabe99}.option .tick{margin-left:auto;color:#5a8150;font-size:15px}.remove{display:block;color:#b56452;font-size:12px;padding:13px 0;margin:4px auto 0}.toast{position:absolute;z-index:6;top:60px;left:24px;right:24px;background:#254d3eea;color:#fff;border-radius:12px;text-align:center;padding:12px;font-size:12px}.reopen{position:absolute;inset:0;display:grid;place-items:center}.reopen button{padding:14px 22px;background:#fff;border-radius:16px}[hidden]{display:none!important}.single header,.single .caption,.single .description{display:none}.single .gallery{display:block;padding:0}.single .candidate{display:none;width:100%}.single .candidate.selected{display:block}.single .phone{height:100vh;min-height:620px;border:0;border-radius:0;box-shadow:none}@media(max-width:600px){header{padding:22px 18px 17px}.gallery{padding:0 16px 25px;gap:16px}.candidate{width:min(360px,calc(100vw - 32px))}}
</style></head><body><header><h1>家庭成员 · 五种设计方向</h1><p>管理者置顶 · 清晰标记「我」· 按需修改昵称 · 点击成员操作体验权限面板<br>交互仅保存在当前设计稿，不会修改真实家庭。</p><nav class="perspectives" aria-label="预览身份"></nav><nav class="toolbar"></nav></header><main class="gallery"></main><script>
const titles=['简洁名册','深绿家庭卡','角色分组','成员卡片','我的家庭名片'];const descriptions=['保留熟悉的列表，头像与角色各归其位。昵称通过底部入口修改，页面最简洁。','呼应邀请页的深绿渐变，管理者单独强调。家庭信息、成员和个人设置分层呈现。','按「管理者 / 家庭成员」分组，权限关系一眼明确。适合以后成员更多的家庭。','两列人物卡片，让每个人都有独立位置。管理者卡片优先，操作直接放在卡片底部。','将自己的家庭身份做成名片，昵称可就地编辑。其他成员列在下方，生活感更强。'];
const query=new URLSearchParams(location.search);const isEditor=query.get('view')==='editor';const myName=isEditor?'王泽宇2':'王泽宇';const myRole=isEditor?'编辑者':'管理者';const me='<span class="self">我</span>';
const state=titles.map(()=>({name:myName,role:'编辑者',removed:false}));
document.querySelector('.perspectives').innerHTML=`<a href="?view=admin" class="${!isEditor?'active':''}" ${!isEditor?'aria-current="page"':''}>管理者 · 王泽宇</a><a href="?view=editor" class="${isEditor?'active':''}" ${isEditor?'aria-current="page"':''}>编辑者 · 王泽宇2</a>`;
if(isEditor)document.querySelector('header p').innerHTML='编辑者视角 · 管理者置顶 · 只能修改自己的昵称，无成员权限操作<br>交互仅保存在当前设计稿，不会修改真实家庭。';
const avatar=(admin=false)=>`<div class="avatar ${admin?'admin':''}">宇</div>`;
function owner(){return `<div class="person">${avatar(true)}<div class="identity"><div class="name" ${isEditor?'':'data-my-name'}>王泽宇${isEditor?'':me}</div><div class="sub">家庭管理者</div></div><span class="badge">管理者</span></div>`}
function member(){return `<div class="person other">${avatar()}<div class="identity"><div class="name" ${isEditor?'data-my-name':''}>王泽宇2${isEditor?me:''}</div><div class="sub" data-role>编辑者 · 可添加和编辑物品</div></div>${isEditor?'<span class="badge">编辑者</span>':'<button class="action dots" data-action="roles" aria-label="管理王泽宇2的权限">···</button>'}</div>`}
const editEntry=()=>`<button class="edit-entry" data-action="nickname"><span>我的家庭昵称<small>家人会看到这个名字</small></span><span class="arrow">修改 ›</span></button>`;
const head=(sub='王泽宇的宿舍 · 2 位成员')=>`<div class="handle"></div><div class="sheethead"><div><h2>家庭成员</h2><small>${sub}</small></div><button class="close" aria-label="关闭成员列表" data-action="close">×</button></div>`;
function content(i){if(i===0)return `${head()}<div class="content">${owner()}${member()}${editEntry()}<p class="footnote">${isEditor?'你可以添加和编辑家庭物品':'管理者可调整其他成员的权限'}</p></div>`;
if(i===1)return `<div class="hero"><button class="close" aria-label="关闭成员列表" data-action="close">×</button><div class="eyebrow">用本 · 家庭共享</div><h2>王泽宇的宿舍</h2><p>家庭成员 · 2 人一起记录生活</p></div><div class="content">${owner()}${member()}${editEntry()}<p class="footnote">共享物品，留住每一份生活的痕迹。</p></div>`;
if(i===2)return `${head()}<div class="content"><div class="group-label"><span>管理者</span><span>1 人</span></div><div class="group">${owner()}</div><div class="group-label"><span>家庭成员</span><span>1 人</span></div><div class="group">${member()}</div>${editEntry()}<p class="footnote">编辑者可添加和编辑物品，查看者仅可查看。</p></div>`;
if(i===3)return `${head()}<div class="content"><div class="tiles"><div class="tile owner">${avatar(true)}<div class="name" ${isEditor?'':'data-my-name'}>王泽宇${isEditor?'':me}</div><span class="badge">管理者</span>${isEditor?'<span class="tile-static">家庭管理者</span>':'<button class="tile-action" data-action="nickname">修改昵称 ↗</button>'}</div><div class="tile other">${avatar()}<div class="name" ${isEditor?'data-my-name':''}>王泽宇2${isEditor?me:''}</div><span class="badge" data-role>编辑者</span>${isEditor?'<button class="tile-action" data-action="nickname">修改昵称 ↗</button>':'<button class="tile-action" data-action="roles">管理权限 ›</button>'}</div></div><p class="footnote">每个人都有自己的位置。<br>管理者负责成员权限，编辑者一起整理家庭物品。</p></div>`;
return `${head()}<div class="content">${isEditor?owner():''}<div class="profile">${avatar(!isEditor)}<div class="identity"><div class="sub">我的家庭身份</div><div class="name" data-my-name>${myName}${me}</div><span class="badge">${myRole}</span><br><button class="action" data-action="nickname">修改家庭昵称 ↗</button></div></div>${isEditor?'':'<div class="group-label"><span>一起记录的人</span><span>1 位家人</span></div>'+member()}<p class="footnote">家庭昵称仅在这个家庭中显示</p></div>`}
document.querySelector('.toolbar').innerHTML=titles.map((t,i)=>`<a href="#v${i+1}">0${i+1} ${t}</a>`).join('');document.querySelector('.gallery').innerHTML=titles.map((t,i)=>`<section id="v${i+1}" class="candidate v${i+1} ${isEditor?'editor-view':''}"><h2 class="caption"><b>0${i+1}</b>${t}</h2><div class="phone"><div class="status"><span>9:41</span><span>▮▮▮　 Wi-Fi　▰</span></div><div class="background"><div class="logo">用本</div><span class="space">⌂ 王泽宇的宿舍 ﹀</span><h3>空间</h3><div class="backcard">王泽宇的宿舍<small>${myRole}　·　0 件物品</small></div></div><div class="scrim"></div><div class="sheet">${content(i)}<div class="safe"></div></div><div class="panel-cover" hidden></div><div class="toast" hidden></div><div class="reopen" hidden><button data-action="reopen">重新打开成员列表</button></div></div><p class="description">${descriptions[i]}</p></section>`).join('');
function toast(card,text){const t=card.querySelector('.toast');t.textContent=text;t.hidden=false;setTimeout(()=>t.hidden=true,2200)}
function panel(card,html){const cover=card.querySelector('.panel-cover');cover.innerHTML=`<div class="panel" role="dialog" aria-modal="true">${html}</div>`;cover.hidden=false;cover.onclick=e=>{if(e.target===cover)cover.hidden=true}}
function nickname(card,i){panel(card,`<h3>修改家庭昵称</h3><p class="hint">家人会用这个名字认出你，仅在当前家庭显示。</p><form><label for="nickname${i}">家庭昵称</label><input id="nickname${i}" maxlength="30" placeholder="填写家庭昵称" autocomplete="off"><div class="error" aria-live="polite"></div><button class="primary" type="submit">保存昵称</button><button class="cancel" type="button" data-action="cancel">取消</button></form>`);const input=card.querySelector('input');input.value=state[i].name;card.querySelector('form').onsubmit=e=>{e.preventDefault();if(!input.value.trim()){input.classList.add('invalid');card.querySelector('.error').textContent='请填写家庭昵称';input.focus();return}state[i].name=input.value.trim();const name=card.querySelector('[data-my-name]');name.textContent=state[i].name;name.insertAdjacentHTML('beforeend','<span class="self">我</span>');card.querySelector('.panel-cover').hidden=true;toast(card,'昵称已更新 · 仅演示')};input.oninput=()=>{input.classList.remove('invalid');card.querySelector('.error').textContent=''}}
function roles(card,i){if(isEditor)return;panel(card,`<h3>王泽宇2 的权限</h3><p class="hint">选择成员可以在家庭里做什么。</p>${['编辑者','查看者'].map((r,j)=>`<button class="option ${state[i].role===r?'selected':''}" data-role-option="${r}"><span><b>${r}</b><small>${j?'仅查看家庭物品与记录':'可添加、整理和编辑家庭物品'}</small></span><span class="tick">${state[i].role===r?'✓':'○'}</span></button>`).join('')}<button class="remove" data-action="remove">移除成员</button><button class="cancel" data-action="cancel">返回成员列表</button>`)}
document.querySelectorAll('.candidate').forEach((card,i)=>{card.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const act=btn.dataset.action,cover=card.querySelector('.panel-cover');if(act==='nickname')nickname(card,i);if(act==='roles')roles(card,i);if(act==='cancel')cover.hidden=true;if(act==='close'){card.querySelector('.sheet').hidden=true;card.querySelector('.reopen').hidden=false}if(act==='reopen'){card.querySelector('.sheet').hidden=false;card.querySelector('.reopen').hidden=true}if(!isEditor&&btn.dataset.roleOption){state[i].role=btn.dataset.roleOption;card.querySelector('[data-role]').textContent=state[i].role+(i===3?'':state[i].role==='编辑者'?' · 可添加和编辑物品':' · 仅可查看物品');cover.hidden=true;toast(card,'权限已更新 · 仅演示')}if(!isEditor&&act==='remove')panel(card,`<h3>移除王泽宇2？</h3><p class="hint">移除后将无法访问家庭。再次加入需要使用移除后生成的新邀请。</p><button class="primary" data-action="confirm-remove">确认移除</button><button class="cancel" data-action="cancel">取消</button>`);if(!isEditor&&act==='confirm-remove'){card.querySelector('.other').hidden=true;cover.hidden=true;toast(card,'成员已移除 · 刷新可恢复演示')}})});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.panel-cover').forEach(p=>p.hidden=true)});const v=new URLSearchParams(location.search).get('v');if(v&&document.getElementById('v'+v)){document.body.classList.add('single');document.getElementById('v'+v).classList.add('selected')}
</script></body></html>
